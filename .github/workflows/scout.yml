name: talent-scout
on:
  schedule: [{cron: "17 5 * * *"}]   # every day 05:17 UTC
  workflow_dispatch:                   # "Run workflow" button
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      models: read          # free GitHub Models, no extra key needed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Create or update database tables
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f schema.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Scrape and score
        # Wikidata (slow, 1 query/min) only on Mondays to stay well inside free GitHub minutes
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python scout.py --max-new 1500; else python scout.py --sources illegible hn news wikipedia --max-new 1500; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
